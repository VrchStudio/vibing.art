<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibing Art Demo</title>
  <meta name="description" content="Watch the Vibing Art live recorded demo video.">
  <meta property="og:title" content="Vibing Art Live Demo">
  <meta property="og:description" content="Watch the Vibing Art live recorded demo video.">
  <meta property="og:type" content="video.other">
  <meta property="og:video" content="Vibing_Art_demo.mp4">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    main {
      width: min(100%, 1200px);
    }

    video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      background: #000;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <video controls autoplay muted playsinline preload="metadata">
      <source src="/VIbing_Art_demo.mp4" type="video/mp4">
      <a href="/VIbing_Art_demo.mp4">Watch the Vibing Art demo video.</a>
    </video>
  </main>
</body>
</html>
